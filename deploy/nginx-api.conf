# Host nginx — reverse proxy to MailFlow backend (Docker on 127.0.0.1:3001)
#
# Prereqs:
#   1. docker compose -f docker-compose.backend.yml up -d --build
#   2. WebSocket map in /etc/nginx/nginx.conf inside http { }:
#        include /etc/nginx/conf.d/websocket-map.conf;
#      (copy from deploy/nginx-websocket-map.conf)
#   3. sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/mailflow-api
#   4. sudo ln -sf /etc/nginx/sites-available/mailflow-api /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your API domain or EC2 public DNS/IP.

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 15m;

    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Optional: after DNS works, enable HTTPS with:
#   sudo certbot --nginx -d api.example.com
