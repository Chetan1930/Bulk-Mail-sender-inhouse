# Full app from a pre-built image (no build on the server).
#
# On laptop:
#   ./scripts/build-release.sh
#   scp mailflow-app.tar.gz ubuntu@EC2:~/
#
# On EC2:
#   gunzip -c ~/mailflow-app.tar.gz | docker load
#   cp .env.example .env
#   ./scripts/ec2-release-up.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mailflow']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 96m

  app:
    image: mailflow-app:latest
    build:
      context: .
    container_name: mailflow-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mailflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_BATCH_SIZE: ${SENDGRID_BATCH_SIZE:-200}
      SENDGRID_WORKER_CONCURRENCY: ${SENDGRID_WORKER_CONCURRENCY:-4}
      SENDGRID_MAX_RPS: ${SENDGRID_MAX_RPS:-8}
    mem_limit: 768m

volumes:
  postgres_data:
